<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 132 520 488" role="img"
     aria-label="An age-verified vending machine lit up on a Raleigh street at night">
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3d2331"/>
      <stop offset="52%"  stop-color="#2a1622"/>
      <stop offset="100%" stop-color="#1c0e17"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f7dcae"/>
      <stop offset="100%" stop-color="#d99e55"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%"   stop-color="#f0c07a" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#f0c07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streetFall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#140913" stop-opacity="1"/>
      <stop offset="100%" stop-color="#140913" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000"/>
      <stop offset="16%"  stop-color="#fff"/>
      <stop offset="84%"  stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="edgeFade">
      <rect width="520" height="620" fill="url(#edgeGrad)"/>
    </mask>
    <radialGradient id="pool">
      <stop offset="0%"   stop-color="#c98a3c" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#c98a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow the machine throws onto the street behind it -->
  <ellipse cx="320" cy="400" rx="250" ry="250" fill="url(#halo)"/>

  <g mask="url(#edgeFade)">
  <!-- Stars, drawn before the skyline so the buildings occlude them -->
  <g fill="#f7e4d2">
    <circle cx="48"  cy="152" r="1.7" opacity=".70"/>
    <circle cx="86"  cy="140" r="1.2" opacity=".55"/>
    <circle cx="122" cy="174" r="1.5" opacity=".65"/>
    <circle cx="60"  cy="198" r="1.1" opacity=".48"/>
    <circle cx="168" cy="143" r="1.2" opacity=".58"/>
    <circle cx="214" cy="138" r="1.7" opacity=".72"/>
    <circle cx="262" cy="159" r="1.3" opacity=".55"/>
    <circle cx="300" cy="177" r="1.8" opacity=".75"/>
    <circle cx="288" cy="208" r="1.2" opacity=".50"/>
    <circle cx="342" cy="146" r="1.3" opacity=".60"/>
    <circle cx="352" cy="221" r="1.4" opacity=".52"/>
    <circle cx="388" cy="167" r="1.5" opacity=".66"/>
    <circle cx="432" cy="150" r="1.3" opacity=".58"/>
    <circle cx="470" cy="181" r="1.7" opacity=".68"/>
    <circle cx="496" cy="142" r="1.1" opacity=".45"/>
  </g>

  <!-- Two buildings, kept low contrast so the machine stays the subject -->
  <g fill="#2a1522">
    <rect x="150" y="150" width="94" height="412"/>
    <rect x="398" y="236" width="104" height="326"/>
  </g>
  <g fill="#341a28">
    <rect x="24" y="222" width="116" height="340"/>
  </g>

  <!-- Lit windows -->
  <g fill="#f0c07a" opacity=".82">
    <rect x="44"  y="252" width="13" height="18"/><rect x="72"  y="252" width="13" height="18"/>
    <rect x="44"  y="298" width="13" height="18"/><rect x="100" y="298" width="13" height="18"/>
    <rect x="72"  y="344" width="13" height="18"/><rect x="44"  y="390" width="13" height="18"/>
    <rect x="100" y="436" width="13" height="18"/><rect x="72"  y="482" width="13" height="18"/>
    <rect x="168" y="182" width="12" height="17"/><rect x="196" y="182" width="12" height="17"/>
    <rect x="168" y="228" width="12" height="17"/><rect x="212" y="274" width="12" height="17"/>
    <rect x="168" y="320" width="12" height="17"/><rect x="196" y="366" width="12" height="17"/>
    <rect x="212" y="412" width="12" height="17"/><rect x="168" y="458" width="12" height="17"/>
    <rect x="418" y="268" width="12" height="17"/><rect x="452" y="268" width="12" height="17"/>
    <rect x="418" y="314" width="12" height="17"/><rect x="474" y="360" width="12" height="17"/>
    <rect x="452" y="406" width="12" height="17"/><rect x="418" y="452" width="12" height="17"/>
    <rect x="474" y="498" width="12" height="17"/>
  </g>

  <!-- Street -->
  <rect x="0" y="562" width="520" height="58" fill="url(#streetFall)"/>
  <rect x="0" y="562" width="520" height="2.5" fill="#7a2f4f" opacity=".85"/>
  </g>
  <ellipse cx="320" cy="572" rx="168" ry="30" fill="url(#pool)"/>

  <!-- The machine -->
  <g>
    <rect x="246" y="266" width="148" height="296" rx="13" fill="url(#cabinet)"/>
    <rect x="246" y="266" width="148" height="296" rx="13" fill="none" stroke="#7a2f4f" stroke-width="2.5"/>

    <!-- Header band carrying the moon mark -->
    <path d="M246 279a13 13 0 0 1 13-13h122a13 13 0 0 1 13 13v22H246z" fill="#7a2f4f"/>
    <path fill="#f7e4d2" d="M323 289.5a8.4 8.4 0 1 1-7-13 6.8 6.8 0 0 0 7 13z"/>
    <circle fill="#f7e4d2" cx="327" cy="279" r="1.9"/>

    <!-- Lit display window -->
    <rect x="259" y="311" width="122" height="150" rx="6" fill="url(#glass)"/>
    <g fill="#2a1622" opacity=".5">
      <rect x="270" y="324" width="30" height="56" rx="3"/>
      <rect x="305" y="324" width="30" height="56" rx="3"/>
      <rect x="340" y="324" width="30" height="56" rx="3"/>
      <rect x="270" y="390" width="30" height="56" rx="3"/>
      <rect x="305" y="390" width="30" height="56" rx="3"/>
      <rect x="340" y="390" width="30" height="56" rx="3"/>
    </g>
    <!-- Shelf edges -->
    <g fill="#c98a3c" opacity=".55">
      <rect x="259" y="382" width="122" height="3"/>
      <rect x="259" y="448" width="122" height="3"/>
    </g>

    <!-- ID scanner and card reader -->
    <rect x="262" y="474" width="52" height="26" rx="5" fill="#3d2331"/>
    <rect x="269" y="482" width="38" height="10" rx="5" fill="#c98a3c" opacity=".75"/>
    <rect x="326" y="474" width="55" height="26" rx="5" fill="#3d2331"/>
    <rect x="333" y="483" width="41" height="8" rx="4" fill="#7a2f4f"/>

    <!-- Dispense tray -->
    <rect x="262" y="512" width="119" height="30" rx="5" fill="#120810"/>
    <rect x="262" y="512" width="119" height="4" rx="2" fill="#000" opacity=".45"/>
  </g>
</svg>
