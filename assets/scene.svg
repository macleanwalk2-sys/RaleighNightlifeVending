<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"
     aria-label="Illustration of the Raleigh skyline at night with a lit vending machine on the sidewalk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#170a12"/>
      <stop offset="55%"  stop-color="#4a2035"/>
      <stop offset="100%" stop-color="#6d3350"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f7e9d5" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#f7e9d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="machineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f0c07a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f0c07a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="800" height="520" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="520" fill="url(#sky)"/>

    <!-- Stars -->
    <g fill="#f7e9d5" opacity=".75">
      <circle cx="92"  cy="66"  r="2.2"/><circle cx="168" cy="38"  r="1.5"/>
      <circle cx="243" cy="82"  r="1.8"/><circle cx="330" cy="46"  r="1.4"/>
      <circle cx="404" cy="94"  r="2"/>  <circle cx="486" cy="52"  r="1.5"/>
      <circle cx="560" cy="30"  r="1.7"/><circle cx="128" cy="128" r="1.4"/>
      <circle cx="292" cy="140" r="1.6"/><circle cx="620" cy="110" r="1.5"/>
      <circle cx="702" cy="150" r="1.9"/><circle cx="52"  cy="182" r="1.5"/>
    </g>

    <!-- Moon -->
    <circle cx="648" cy="92" r="96" fill="url(#moonGlow)"/>
    <circle cx="648" cy="92" r="38" fill="#f7e9d5"/>
    <circle cx="666" cy="78" r="34" fill="#4a2035" opacity=".92"/>

    <!-- Skyline, far layer -->
    <g fill="#5a2a42">
      <rect x="20"  y="272" width="66" height="180"/>
      <rect x="96"  y="238" width="52" height="214"/>
      <rect x="300" y="256" width="60" height="196"/>
      <rect x="580" y="248" width="58" height="204"/>
      <rect x="648" y="286" width="72" height="166"/>
      <rect x="726" y="262" width="56" height="190"/>
    </g>

    <!-- Skyline, mid layer with the tower -->
    <g fill="#432034">
      <rect x="158" y="206" width="62" height="246"/>
      <rect x="230" y="262" width="60" height="190"/>
      <!-- Raleigh's stepped high-rise -->
      <path d="M372 452V150h74v302z"/>
      <path d="M382 150V116h54v34z"/>
      <rect x="404" y="86" width="10" height="32"/>
      <rect x="456" y="228" width="56" height="224"/>
      <rect x="520" y="272" width="52" height="180"/>
    </g>

    <!-- Lit windows -->
    <g fill="#f0c07a">
      <g opacity=".9">
        <rect x="172" y="226" width="10" height="14"/><rect x="196" y="226" width="10" height="14"/>
        <rect x="172" y="258" width="10" height="14"/><rect x="196" y="290" width="10" height="14"/>
        <rect x="172" y="322" width="10" height="14"/><rect x="196" y="354" width="10" height="14"/>
        <rect x="244" y="282" width="10" height="14"/><rect x="268" y="282" width="10" height="14"/>
        <rect x="244" y="314" width="10" height="14"/><rect x="268" y="346" width="10" height="14"/>
        <rect x="388" y="176" width="12" height="16"/><rect x="416" y="176" width="12" height="16"/>
        <rect x="388" y="212" width="12" height="16"/><rect x="416" y="248" width="12" height="16"/>
        <rect x="388" y="284" width="12" height="16"/><rect x="416" y="320" width="12" height="16"/>
        <rect x="388" y="356" width="12" height="16"/><rect x="416" y="392" width="12" height="16"/>
        <rect x="470" y="248" width="10" height="14"/><rect x="492" y="280" width="10" height="14"/>
        <rect x="470" y="312" width="10" height="14"/><rect x="492" y="344" width="10" height="14"/>
        <rect x="534" y="292" width="10" height="14"/><rect x="556" y="324" width="10" height="14"/>
        <rect x="594" y="268" width="10" height="14"/><rect x="616" y="300" width="10" height="14"/>
        <rect x="662" y="306" width="10" height="14"/><rect x="694" y="338" width="10" height="14"/>
        <rect x="740" y="282" width="10" height="14"/><rect x="762" y="314" width="10" height="14"/>
        <rect x="36"  y="292" width="10" height="14"/><rect x="60"  y="324" width="10" height="14"/>
        <rect x="110" y="258" width="10" height="14"/><rect x="132" y="290" width="10" height="14"/>
        <rect x="314" y="276" width="10" height="14"/><rect x="336" y="308" width="10" height="14"/>
      </g>
    </g>

    <!-- Street -->
    <rect x="0" y="452" width="800" height="68" fill="#241019"/>
    <rect x="0" y="452" width="800" height="4" fill="#7a2f4f"/>

    <!-- Warm pool of light on the sidewalk -->
    <ellipse cx="600" cy="500" rx="150" ry="34" fill="url(#machineGlow)"/>

    <!-- The machine -->
    <g>
      <rect x="548" y="330" width="104" height="158" rx="9" fill="#331828"/>
      <rect x="548" y="330" width="104" height="158" rx="9" fill="none" stroke="#7a2f4f" stroke-width="3"/>
      <!-- Lit display window -->
      <rect x="560" y="344" width="80" height="88" rx="5" fill="#f0c07a" opacity=".9"/>
      <g fill="#331828" opacity=".55">
        <rect x="570" y="356" width="12" height="26" rx="2"/>
        <rect x="590" y="356" width="12" height="26" rx="2"/>
        <rect x="610" y="356" width="12" height="26" rx="2"/>
        <rect x="570" y="394" width="12" height="26" rx="2"/>
        <rect x="590" y="394" width="12" height="26" rx="2"/>
        <rect x="610" y="394" width="12" height="26" rx="2"/>
      </g>
      <!-- Card reader + dispense tray -->
      <rect x="562" y="442" width="30" height="16" rx="3" fill="#7a2f4f"/>
      <rect x="602" y="442" width="38" height="8"  rx="4" fill="#7a2f4f" opacity=".6"/>
      <rect x="562" y="466" width="78" height="12" rx="3" fill="#241019"/>
    </g>

    <!-- Bar doorway, left, to place the machine in a venue -->
    <g>
      <rect x="118" y="356" width="132" height="96" fill="#331828"/>
      <rect x="140" y="382" width="88" height="70" rx="4" fill="#f0c07a" opacity=".22"/>
      <rect x="118" y="348" width="132" height="12" rx="4" fill="#7a2f4f"/>
      <circle cx="184" cy="336" r="7" fill="#f0c07a" opacity=".8"/>
    </g>
  </g>
</svg>
