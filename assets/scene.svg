<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 520 550" role="img"
     aria-label="A wall-mounted, age-verified vending machine lit up beside a bar door on a Raleigh street at night">
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3d2331"/>
      <stop offset="52%"  stop-color="#2a1622"/>
      <stop offset="100%" stop-color="#1c0e17"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f7dcae"/>
      <stop offset="100%" stop-color="#d99e55"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%"   stop-color="#f0c07a" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#f0c07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streetFall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#140913" stop-opacity="1"/>
      <stop offset="100%" stop-color="#140913" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000"/>
      <stop offset="16%"  stop-color="#fff"/>
      <stop offset="84%"  stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="edgeFade">
      <rect width="520" height="620" fill="url(#edgeGrad)"/>
    </mask>
    <radialGradient id="pool">
      <stop offset="0%"   stop-color="#c98a3c" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#c98a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doorGlow">
      <stop offset="0%"   stop-color="#f0c07a" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#f0c07a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="325" cy="400" rx="250" ry="250" fill="url(#halo)"/>

  <g mask="url(#edgeFade)">
  <!-- Stars, drawn before the skyline so the buildings occlude them -->
  <g fill="#f7e4d2">
    <circle cx="46"  cy="132" r="1.6" opacity=".62"/>
    <circle cx="104" cy="92"  r="1.3" opacity=".52"/>
    <circle cx="158" cy="146" r="1.2" opacity=".48"/>
    <circle cx="214" cy="100" r="1.8" opacity=".72"/>
    <circle cx="258" cy="186" r="1.1" opacity=".40"/>
    <circle cx="286" cy="138" r="1.4" opacity=".58"/>
    <circle cx="330" cy="86"  r="1.2" opacity=".46"/>
    <circle cx="368" cy="152" r="1.6" opacity=".64"/>
    <circle cx="436" cy="104" r="1.4" opacity=".55"/>
    <circle cx="486" cy="140" r="1.3" opacity=".50"/>
  </g>

  <!-- Neighbours behind -->
  <g fill="#2a1522">
    <rect x="24"  y="222" width="116" height="340"/>
    <rect x="418" y="250" width="84"  height="312"/>
  </g>
  <!-- The venue's own wall, closest to us. The machine hangs on this. -->
  <rect x="160" y="170" width="250" height="392" fill="#341a28"/>

  <!-- Lit windows -->
  <g fill="#f0c07a" opacity=".8">
    <rect x="44"  y="252" width="13" height="18"/><rect x="76"  y="252" width="13" height="18"/>
    <rect x="44"  y="306" width="13" height="18"/><rect x="108" y="306" width="13" height="18"/>
    <rect x="76"  y="360" width="13" height="18"/><rect x="44"  y="414" width="13" height="18"/>
    <rect x="108" y="468" width="13" height="18"/>
    <rect x="436" y="284" width="12" height="17"/><rect x="470" y="284" width="12" height="17"/>
    <rect x="436" y="338" width="12" height="17"/><rect x="470" y="392" width="12" height="17"/>
    <rect x="436" y="446" width="12" height="17"/><rect x="470" y="500" width="12" height="17"/>
    <rect x="186" y="204" width="14" height="19"/><rect x="228" y="204" width="14" height="19"/>
    <rect x="330" y="204" width="14" height="19"/><rect x="372" y="204" width="14" height="19"/>
    <rect x="186" y="254" width="14" height="19"/><rect x="372" y="254" width="14" height="19"/>
  </g>

  <!-- Street -->
  <rect x="0" y="562" width="520" height="58" fill="url(#streetFall)"/>
  <rect x="0" y="562" width="520" height="2.5" fill="#7a2f4f" opacity=".85"/>
  </g>

  <!-- The bar door beside it, so the wall reads as a venue -->
  <ellipse cx="207" cy="530" rx="80" ry="70" fill="url(#doorGlow)"/>
  <rect x="178" y="440" width="58" height="122" rx="3" fill="#1c0e17"/>
  <rect x="186" y="452" width="42" height="110" rx="2" fill="#f0c07a" opacity=".26"/>
  <rect x="174" y="430" width="66" height="11" rx="4" fill="#7a2f4f"/>

  <ellipse cx="325" cy="572" rx="150" ry="28" fill="url(#pool)"/>

  <!-- The machine: wall mounted, 21.6 x 33.3 proportions -->
  <g>
    <!-- Contact shadow on the wall behind it -->
    <rect x="264" y="312" width="134" height="206" rx="11" fill="#150a11" opacity=".55"/>

    <rect x="258" y="300" width="134" height="206" rx="11" fill="url(#cabinet)"/>
    <rect x="258" y="300" width="134" height="206" rx="11" fill="none" stroke="#7a2f4f" stroke-width="2.5"/>

    <!-- Header band carrying the moon mark -->
    <path d="M258 311a11 11 0 0 1 11-11h112a11 11 0 0 1 11 11v11H258z" fill="#7a2f4f"/>

    <!-- Touchscreen -->
    <rect x="269" y="330" width="112" height="100" rx="5" fill="url(#glass)"/>
    <g fill="#2a1622" opacity=".5">
      <rect x="277" y="340" width="28" height="38" rx="3"/>
      <rect x="311" y="340" width="28" height="38" rx="3"/>
      <rect x="345" y="340" width="28" height="38" rx="3"/>
      <rect x="277" y="386" width="28" height="38" rx="3"/>
      <rect x="311" y="386" width="28" height="38" rx="3"/>
      <rect x="345" y="386" width="28" height="38" rx="3"/>
    </g>

    <!-- ID scanner and card reader -->
    <rect x="269" y="440" width="46" height="21" rx="4" fill="#3d2331"/>
    <rect x="275" y="447" width="34" height="8" rx="4" fill="#c98a3c" opacity=".75"/>
    <rect x="325" y="440" width="56" height="21" rx="4" fill="#3d2331"/>
    <rect x="331" y="447" width="44" height="7" rx="3.5" fill="#7a2f4f"/>

    <!-- Product door -->
    <rect x="269" y="470" width="112" height="26" rx="4" fill="#120810"/>
    <rect x="269" y="470" width="112" height="3.5" rx="1.75" fill="#000" opacity=".45"/>
  </g>
</svg>
